[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wokbee"
version = "0.1.0"
description = "WokBee（工蜂）— AI 桌面助手（精简脚手架：对话 / AI配置 / 设置）"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7",
    "PyMuPDF>=1.24",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=0.6",
    "httpx>=0.27",
]

[project.scripts]
wokbee = "wokbee.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wokbee = ["resources/**/*"]
