[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wokbee"
version = "0.1.0"
description = "WokBee（工蜂）— AI 桌面助手；含 AutoBee 项目工作流模块"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "PyMuPDF>=1.24",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=0.6",
    "httpx>=0.27",
    "deepagents>=0.7",
    "langchain-openai>=0.3",
    "langgraph>=0.4",
    "langchain-mcp-adapters>=0.1",
]

[project.scripts]
wokbee = "wokbee.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wokbee = ["resources/**/*"]
